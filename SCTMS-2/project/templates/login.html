<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — SmartCity Traffic</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Syne:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --neon: #00f5d4;
      --neon2: #7b2fff;
      --warn: #ff4e4e;
      --dark: #06090f;
      --card: #0d1325;
      --border: rgba(0,245,212,0.18);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--dark);
      font-family: 'Syne', sans-serif;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,245,212,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,245,212,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
    }
    /* glowing orbs */
    .orb {
      position: fixed; border-radius: 50%; filter: blur(80px);
      pointer-events: none; animation: orbFloat 8s ease-in-out infinite alternate;
    }
    .orb1 { width:400px;height:400px;background:rgba(0,245,212,0.07);top:-100px;left:-100px; }
    .orb2 { width:350px;height:350px;background:rgba(123,47,255,0.08);bottom:-80px;right:-80px;animation-delay:2s; }
    @keyframes orbFloat { 0%{transform:translate(0,0)} 100%{transform:translate(30px,30px)} }

    .card {
      position: relative; z-index: 10;
      background: rgba(13,19,37,0.9);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 50px 44px;
      width: 100%; max-width: 420px;
      backdrop-filter: blur(20px);
      box-shadow: 0 0 60px rgba(0,245,212,0.07), 0 30px 60px rgba(0,0,0,0.5);
      animation: slideIn .5s ease;
    }
    @keyframes slideIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

    .logo-link {
      display: block; text-align: center; margin-bottom: 30px;
      text-decoration: none;
      font-family: 'Orbitron', monospace; font-weight: 900; font-size: 1.3rem;
      color: var(--neon); letter-spacing: 3px;
    }
    .logo-link span { color: #7b2fff; }

    .card-title {
      font-family: 'Orbitron', monospace;
      font-size: 1.05rem; font-weight: 700;
      color: #fff; text-align: center;
      margin-bottom: 6px;
    }
    .card-sub {
      text-align: center; font-size: 0.82rem; color: #4a5f7a;
      margin-bottom: 34px;
    }

    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 0.75rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #7090b0; margin-bottom: 8px; }
    input[type=text], input[type=email], input[type=password] {
      width: 100%;
      padding: 13px 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: #e0e8ff;
      font-family: 'Syne', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus {
      border-color: var(--neon);
      box-shadow: 0 0 0 3px rgba(0,245,212,0.08);
    }
    input::placeholder { color: #2a3a50; }

    .btn-submit {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--neon), #00b894);
      border: none; border-radius: 10px;
      font-family: 'Orbitron', monospace;
      font-weight: 700; font-size: 0.85rem;
      letter-spacing: 2px; color: var(--dark);
      cursor: pointer; margin-top: 8px;
      transition: transform .2s, box-shadow .2s;
      box-shadow: 0 0 20px rgba(0,245,212,0.3);
    }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 0 35px rgba(0,245,212,0.5); }

    .divider { display:flex; align-items:center; gap:14px; margin:24px 0; }
    .divider::before,.divider::after { content:'';flex:1;height:1px;background:rgba(255,255,255,0.07); }
    .divider span { font-size:0.75rem; color:#3a4f68; }

    .footer-link { text-align:center; font-size:0.82rem; color:#4a5f7a; }
    .footer-link a { color:var(--neon); text-decoration:none; font-weight:700; }
    .footer-link a:hover { text-decoration:underline; }

    .error-msg {
      background: rgba(255,78,78,0.12);
      border: 1px solid rgba(255,78,78,0.4);
      border-radius: 8px;
      padding: 11px 14px;
      color: #ff8080;
      font-size: 0.82rem;
      margin-bottom: 20px;
      text-align: center;
    }
    .success-msg {
      background: rgba(0,245,212,0.08);
      border: 1px solid rgba(0,245,212,0.3);
      border-radius: 8px;
      padding: 11px 14px;
      color: var(--neon);
      font-size: 0.82rem;
      margin-bottom: 20px;
      text-align: center;
    }
    .back-link {
      display:block; text-align:center; margin-top:20px;
      font-size:0.78rem; color:#3a4f68; text-decoration:none;
    }
    .back-link:hover { color:var(--neon); }
  </style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="card">
  <a href="{{ url_for('launch') }}" class="logo-link">SMART<span>CITY</span></a>

  <div class="card-title">Welcome Back</div>
  <div class="card-sub">Sign in to your traffic control dashboard</div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="{{ 'error-msg' if category == 'error' else 'success-msg' }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST" action="{{ url_for('login') }}">
    <div class="form-group">
      <label>Username or Email</label>
      <input type="text" name="username" placeholder="Enter your username" required autocomplete="username"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="Enter your password" required autocomplete="current-password"/>
    </div>
    <button type="submit" class="btn-submit">SIGN IN</button>
  </form>

  <div class="divider"><span>OR</span></div>
  <div class="footer-link">
    Don't have an account? <a href="{{ url_for('signup') }}">Create one</a>
  </div>

  <a href="{{ url_for('launch') }}" class="back-link">← Back to Home</a>
</div>
</body>
</html>
