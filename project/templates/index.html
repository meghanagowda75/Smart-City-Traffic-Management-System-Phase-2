<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Traffic Monitoring</title> 

    <style>
        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background: #0b0e1a;
            color: white;
        }

        h1 {
            text-align: center;
            margin-top: 20px;
            color: #00eaff;
        }

        .stats-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .card {
            background: #1b2238;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #00eaff55;
            min-width: 200px;
            text-align: center;
            box-shadow: 0 0 15px #00eaff33;
        }

        .card-title {
            font-size: 15px;
            color: #a8c8ff;
        }

        .card-value {
            margin-top: 10px;
            font-size: 32px;
            color: #00eaff;
            font-weight: bold;
        }

        .red {
            background: #3b0f0f;
            border-color: red;
            box-shadow: 0 0 15px #ff000033;
        }

        #stream {
            display: block;
            margin: 20px auto;
            width: 90%;
            max-width: 900px;
            border-radius: 12px;
            border: 3px solid #00eaff55;
        }

        .table-section {
            width: 90%;
            margin: 20px auto;
            padding: 20px;
            background: #151926;
            border-radius: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            padding: 10px;
            background: #1d2238;
            color: #00eaff;
            text-transform: uppercase;
            border-bottom: 2px solid #00eaff55;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #28304a;
        }

        .overspeed-row {
            background: #3b0f0f;
            color: #ff7777;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1>🚦 Smart Traffic Monitoring Dashboard</h1>


<div style="text-align:center; margin-top:20px;">
    <input type="file" id="videoUpload" accept="video/*" style="display:none;" />
    <button onclick="document.getElementById('videoUpload').click()"
            style="padding:10px 20px; background:#00eaff; color:black; border:none; border-radius:8px; cursor:pointer;">
        Upload Video
    </button>
</div>



<div style="text-align:center; margin-top:15px;">
    <button onclick="window.open('/simulator', '_blank')" 
            style="padding:10px 20px; background:#ffcc00; color:black; border:none; border-radius:8px; cursor:pointer;">
        Open Traffic Simulation
    </button>
</div>



<img id="stream" src="/video_feed" style="width:100%; height:auto;">


<div class="stats-container">

    <div class="card">
        <div class="card-title">Vehicles IN</div>
        <div class="card-value" id="in_count">0</div>
    </div>

    <div class="card">
        <div class="card-title">Vehicles OUT</div>
        <div class="card-value" id="out_count">0</div>
    </div>

    <div class="card">
        <div class="card-title">Active Vehicles</div>
        <div class="card-value" id="active_count">0</div>
    </div>

    <div class="card red">
        <div class="card-title">Overspeed Vehicles</div>
        <div class="card-value" id="overspeed_count">0</div>
    </div>

</div>

<div class="table-section">
    <h2 style="text-align:center; color:#00eaff;">Live Vehicle Information</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Class</th>
                <th>Speed (km/h)</th>
            </tr>
        </thead>
        <tbody id="vehicles_table">
            <tr><td colspan="3" style="text-align:center;">Loading...</td></tr>
        </tbody>
    </table>
</div>


<script>
// Upload video to backend
document.getElementById("videoUpload").addEventListener("change", async function () {
    let formData = new FormData();
    formData.append("video", this.files[0]);

    await fetch("/upload_video", { method: "POST", body: formData });
    document.getElementById("stream").src = "/video_feed?x=" + Date.now();
    // document.getElementById("stream").src = "/video?x=" + Date.now();
    document.getElementById("stream").style.display = "block";
});

async function updateData() {
    const res = await fetch("/data");
    const data = await res.json();

    document.getElementById("in_count").innerText = data.in_count;
    document.getElementById("out_count").innerText = data.out_count;
    document.getElementById("active_count").innerText = data.current_vehicles.length;
    document.getElementById("overspeed_count").innerText = data.overspeed.length;

    const tbody = document.getElementById("vehicles_table");
    tbody.innerHTML = "";

    data.current_vehicles.forEach(v => {
        const rowClass = v.overspeed ? "overspeed-row" : "";
        tbody.innerHTML += `
            <tr class="${rowClass}">
                <td>${v.id}</td>
                <td>${v.class_name}</td>
                <td>${v.speed}</td>
            </tr>
        `;
    });
}

setInterval(updateData, 1000);
updateData();
</script>
